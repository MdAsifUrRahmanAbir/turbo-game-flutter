name: playbits
description: A Flutter game collection with a 2D racing game and a 2D endless runner.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  flutter_riverpod: ^3.4.2
  msix: ^3.18.0
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  url_launcher:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.6
  flutter_launcher_icons:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/playbits.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/playbits.png"
    background_color: "#0B1230"
    theme_color: "#0B1230"

  windows:
    generate: true
    image_path: "assets/playbits.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/play-bits.png
    - assets/playbits.png

msix_config:
  display_name: PlayBits
  publisher_display_name: Md Asif Ur Rahman Abir
  identity_name: abirdev.playbits
  msix_version: 1.0.0.0

  logo_path: assets/playbits.png

  capabilities: internetClient

  architecture: x64
  sign_msix: true
  install_certificate: true